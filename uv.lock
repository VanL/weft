    { name = "docker" },
    { name = "weft" },
]

[package.metadata]
requires-dist = [
    { name = "docker", specifier = ">=7.1.0,<8" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=7.0" },
    { name = "weft", specifier = ">=0.9.95" },
]
provides-extras = ["dev"]

