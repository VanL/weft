[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "weft-django"
version = "0.9.56"
description = "Django integration layer for Weft"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Van Lindberg", email = "van@modelmonster.ai"},
]
dependencies = [
    "django>=6.1.3",
    "weft>=0.9.121",
]

[project.optional-dependencies]
channels = [
    "channels>=4.3.2",
]
realtime = [
    "channels>=4.3.2",
]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build]
include = [
    "weft_django/**/*.py",
    "weft_django/py.typed",
    "README.md",
]
