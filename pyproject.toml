[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "weft"
version = "0.9.125"
description = "The durable task substrate for agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Van Lindberg", email = "van@modelmonster.ai"},
]
keywords = ["workflow", "orchestration", "automation", "task-execution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = [
    "llm>=0.37.1",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "processtitle>=1.3",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "setproctitle>=1.3.8",
    "simplebroker>=8.8.2",
    "typer>=0.29.0",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
pg = [
    "simplebroker-pg>=4.8.2",
]
docker = [
    "weft-docker>=0.9.100",
]
django = [
    "weft-django>=0.9.60",
]
django-channels = [
    "weft-django[channels]>=0.9.60",
]
macos-sandbox = [
    "weft-macos-sandbox>=0.6.29",
]
microsandbox = [
    "weft-microsandbox>=0.5.30; platform_system != 'Windows'",
]
all = [
    "simplebroker-pg>=4.8.2",
    "weft-docker>=0.9.100",
    "weft-django>=0.9.60",
    "weft-macos-sandbox>=0.6.29",
    "weft-microsandbox>=0.5.30; platform_system != 'Windows'",
]
dev = [
    "simplebroker-pg>=4.8.2",
    "weft-docker>=0.9.100",
    "weft-macos-sandbox>=0.6.29",
    "weft-microsandbox>=0.5.30; platform_system != 'Windows'",
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "mypy>=2.4.1",
    "ruff>=0.17.4",
    "pytest-timeout>=2.4.0",
    "types-docker>=7.2.0.20261102",
    "types-psutil>=7.2.2.20260906",
    "types-pyyaml>=6.0.12.20261103",
]

[project.scripts]
weft = "weft.bootstrap:main"

[project.urls]
Homepage = "https://github.com/VanL/weft"
Documentation = "https://github.com/VanL/weft#readme"
Repository = "https://github.com/VanL/weft.git"
Issues = "https://github.com/VanL/weft/issues"

[tool.uv]
constraint-dependencies = [
    "ast-serialize>=0.13.1",
    "certifi>=2026.10.23",
    "charset-normalizer>=3.5.2",
    "httpcore2>=2.16.0",
    "httpx2>=2.16.0",
    "idna>=3.20",
    "openai>=3.49.0",
    "pip>=26.3",
    "pluggy>=1.7.0",
    "pygments>=2.21.0",
    "python-dateutil>=4.0.0",
    "setuptools>=84.2.1",
    "sqlite-utils>=4.2.1",
    "sqlparse>=0.6.1",
    "tzdata>=2026.6",
    "typing-inspection>=0.4.5",
    "wcwidth>=0.9.4",
]

[tool.uv.sources]
weft-docker = { path = "./extensions/weft_docker", editable = true }
weft-django = { path = "./integrations/weft_django", editable = true }
weft-macos-sandbox = { path = "./extensions/weft_macos_sandbox", editable = true }
weft-microsandbox = { path = "./extensions/weft_microsandbox", editable = true }

[tool.hatch.build]
include = [
    "weft/**/*.py",
    "weft/**/*.json",
    "weft/py.typed",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/",
    "agent_history/",
    ".*",
    "*.db",
    "simplebroker/",
]

[tool.pytest.ini_options]
minversion = "9.2.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m 'not slow' -n logical --maxprocesses 12 --dist load"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "shared: backend-agnostic tests that should pass across supported backends",
    "sqlite_only: tests that intentionally validate SQLite/file-backed behavior",
    "property: property-based invariant tests using Hypothesis",
]

[tool.mypy]
python_version = "3.13"
no_namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "setproctitle"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "weft_docker.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "channels.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-include = [
    "bin/check-doc-paths",
    "bin/check-dom15-fixtures",
    "bin/coalesce-check",
    "bin/pytest-live-providers",
    "bin/pytest-pg",
    "bin/pytest-worker-count",
]

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C901", # mccabe complexity
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["weft", "weft_django", "weft_microsandbox", "simplebroker"]

[tool.ruff.lint.mccabe]
max-complexity = 10
