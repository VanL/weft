name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      reactor_baseline:
        description: 'Optional full baseline commit SHA for paired reactor measurements'
        required: false
        default: ''
        type: string

env:
  UV_VERSION: "0.13.0"

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.test_slice }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        test_slice: [cli, core-commands, remaining]
        include:
          - test_slice: cli
            pytest_targets: tests/cli
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace
          - test_slice: core-commands
            pytest_targets: tests/commands tests/core
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace
          - test_slice: remaining
            pytest_targets: tests/architecture tests/context tests/helpers tests/liveness tests/specs tests/system tests/tasks tests/taskspec tests/test_harness_pg_connections.py tests/test_harness_registration.py tests/test_long_session_surface_benchmark.py tests/test_multiqueue_polling_benchmark.py
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,docker,django,macos-sandbox,microsandbox]"

    - name: Set pytest worker count
      run: |
        python bin/pytest-worker-count --github-env

    - name: Run tests with pytest
      if: ${{ matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13' }}
      env:
        WEFT_TEST_PROGRESS_HEARTBEAT_SECONDS: ${{ matrix.os == 'windows-latest' && '120' || '' }}
        WEFT_TEST_DIAGNOSTICS_DIR: ${{ matrix.os == 'windows-latest' && matrix.test_slice == 'cli' && format('{0}/weft-test-diagnostics', runner.temp) || '' }}
      run: |
        pytest -v --tb=short -m "not slow" ${{ matrix.pytest_targets }} --override-ini="addopts=-ra -q --strict-markers -n logical --dist load" ${{ matrix.pytest_diagnostic_args }} ${{ matrix.os == 'windows-latest' && matrix.test_slice == 'core-commands' && '--junitxml=pytest-results.xml' || '' }}

    - name: Run tests with coverage
      if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
      env:
        COVERAGE_FILE: .coverage.${{ matrix.test_slice }}
      run: |
        pytest -v --tb=short -m "" ${{ matrix.pytest_targets }} --override-ini="addopts=-ra -q --strict-markers -n logical --dist load" ${{ matrix.pytest_diagnostic_args }} --cov=weft --cov-report=term-missing

    - name: Verify Windows reactor cases executed
      if: ${{ always() && matrix.os == 'windows-latest' && matrix.test_slice == 'core-commands' }}
      run: python tests/subprocess_reactor_benchmark.py --verify-windows pytest-results.xml

    - name: Measure paired subprocess reactor costs
      if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.reactor_baseline != '' && matrix.python-version == '3.13' && matrix.test_slice == 'core-commands' && matrix.os != 'macos-latest' }}
      shell: bash
      env:
        REACTOR_BASELINE: ${{ inputs.reactor_baseline }}
      run: python tests/subprocess_reactor_benchmark.py --baseline "$REACTOR_BASELINE" --output reactor-measurements

    - name: Upload reactor measurements and Windows execution evidence
      if: ${{ always() && matrix.test_slice == 'core-commands' && (matrix.os == 'windows-latest' || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && github.event_name == 'workflow_dispatch' && inputs.reactor_baseline != '')) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: reactor-evidence-${{ matrix.os }}-${{ matrix.python-version }}
        path: |
          reactor-measurements
          pytest-results.xml
        if-no-files-found: warn

    - name: Upload coverage data
      if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-data-${{ matrix.test_slice }}
        path: .coverage.${{ matrix.test_slice }}
        if-no-files-found: warn
        include-hidden-files: true

    - name: Upload Windows CLI diagnostics
      if: ${{ always() && matrix.os == 'windows-latest' && matrix.test_slice == 'cli' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostics-windows-${{ matrix.python-version }}-cli
        path: ${{ runner.temp }}/weft-test-diagnostics
        if-no-files-found: warn

    - name: Test CLI installation
      if: ${{ matrix.test_slice == 'cli' }}
      run: |
       weft --version

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: test
    if: ${{ always() && !cancelled() }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Download coverage data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: coverage-data-*
        path: coverage-data
        merge-multiple: true

    - name: Combine coverage reports
      run: |
        coverage combine coverage-data
        coverage report
        coverage xml -o coverage.xml

    - name: Upload coverage report
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: VanL/weft

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,docker,django,macos-sandbox,microsandbox]"

    - name: Run linting with ruff
      run: |
        ruff check .

    - name: Check generated Ruff suppression index
      run: |
        python bin/ruff_suppression_index.py --check

    - name: Check formatting with ruff
      run: |
        ruff format --check weft tests integrations/weft_django extensions/weft_docker extensions/weft_macos_sandbox extensions/weft_microsandbox

    - name: Type check with mypy
      run: |
        mypy weft tests bin integrations/weft_django/weft_django extensions/weft_docker/weft_docker extensions/weft_macos_sandbox/weft_macos_sandbox extensions/weft_microsandbox/weft_microsandbox --config-file pyproject.toml

  test-postgres:
    name: test-postgres (${{ matrix.test_slice }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        test_slice: [cli, core-commands, remaining]
        include:
          - test_slice: cli
            pytest_targets: tests/cli
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace
          - test_slice: core-commands
            pytest_targets: tests/commands tests/core
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace
          - test_slice: remaining
            pytest_targets: tests/architecture tests/context tests/helpers tests/liveness tests/specs tests/system tests/tasks tests/taskspec tests/test_harness_pg_connections.py tests/test_harness_registration.py tests/test_long_session_surface_benchmark.py tests/test_multiqueue_polling_benchmark.py
            pytest_diagnostic_args: --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: Set pytest worker count
      run: |
        python bin/pytest-worker-count --github-env

    - name: Run PostgreSQL-compatible tests
      env:
        PYTEST_ADDOPTS: ${{ matrix.pytest_diagnostic_args }}
        WEFT_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/weft-test-diagnostics
      run: |
        uv run --extra dev --extra docker --extra macos-sandbox --extra microsandbox bin/pytest-pg --all ${{ matrix.pytest_targets }}

    - name: Upload PostgreSQL diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: diagnostics-postgres-${{ matrix.test_slice }}
        path: ${{ runner.temp }}/weft-test-diagnostics
        if-no-files-found: warn

  test-django-integration:
    needs: [test, test-postgres, coverage, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,django]"

    - name: Run Django integration tests
      run: |
        pytest -q -n 0 integrations/weft_django/tests --durations=50 --durations-min=1.0 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

  test-docker-extension:
    needs: [test, test-postgres, coverage, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,docker,django]"

    - name: Verify Docker is available
      run: |
        docker version

    - name: Run Docker extension tests
      run: |
        pytest -q -n 0 extensions/weft_docker/tests --durations=50 --durations-min=1.0 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

  test-macos-sandbox-extension:
    needs: [test, test-postgres, coverage, lint]
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,django,macos-sandbox]"

    - name: Run macOS sandbox extension tests
      run: |
        pytest -q -n 0 extensions/weft_macos_sandbox/tests --durations=50 --durations-min=1.0 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

  test-microsandbox-extension:
    needs: [test, test-postgres, coverage, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,django,microsandbox]"

    - name: Run Microsandbox extension tests
      run: |
        pytest -q -n 0 extensions/weft_microsandbox/tests --durations=50 --durations-min=1.0 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace
