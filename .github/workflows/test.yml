name: Windows pipe witness (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-write-witness:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.13.0'
      - name: Install unchanged runtime and diagnostic dependencies
        run: uv pip install --system -e ".[dev,docker,django,macos-sandbox,microsandbox]"
      - name: Observe native write errors without changing their handling
        run: python -m tests.windows_pipe_witness pipe-witness
      - name: Retain independent write-error and exit witnesses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-pipe-witness
          path: pipe-witness
          if-no-files-found: error
