name: Windows child launch witness (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-launch-witness:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.13.0'
      - name: Install unchanged dependencies
        run: uv pip install --system -e ".[dev,docker,django,macos-sandbox,microsandbox]"
      - name: Set original worker count
        run: python bin/pytest-worker-count --github-env
      - name: Run unchanged full Windows core slice with launch witnesses
        env:
          WEFT_TEST_PROGRESS_HEARTBEAT_SECONDS: '120'
          WEFT_TEST_LAUNCH_WITNESS_DIR: ${{ runner.temp }}/weft-test-diagnostics
        run: pytest -v --tb=short -m "not slow" tests/commands tests/core --override-ini="addopts=-ra -q --strict-markers -n logical --dist load" --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace --junitxml=pytest-results.xml
      - name: Retain launch and worker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-launch-witness
          path: |
            ${{ runner.temp }}/weft-test-diagnostics
            pytest-results.xml
          if-no-files-found: error
