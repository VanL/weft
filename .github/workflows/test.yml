name: Windows environment canary (diagnostic only)

# Temporary diagnostic workflow on branch codex/windows-env-canary. It runs
# the official Windows CLI slice byte-for-byte (same install, worker count,
# pytest command, heartbeat, diagnostics directory, and 50-minute ceiling)
# beside one external observer process, tests/windows_env_canary.py, whose
# lifetime is bounded by a stop file (not by its launching step), and
# optionally moves the test temp root to the D: volume. It replaces no
# official gate and claims no acceptance. Plan:
# docs/plans/2026-10-30-pr48-windows-root-cause-analysis.md
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  windows-env-canary:
    name: canary (${{ matrix.python-version }}, temp-${{ matrix.temp_volume }}, r${{ matrix.repeat }})
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        temp_volume: ["c", "d"]
        repeat: [1, 2]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,docker,django,macos-sandbox,microsandbox]"

    - name: Set pytest worker count
      run: |
        python bin/pytest-worker-count --github-env

    - name: Select test temp volume and probe directories
      shell: pwsh
      run: |
        $testTemp = if ('${{ matrix.temp_volume }}' -eq 'd') { Join-Path $env:RUNNER_TEMP 'weft-test-temp' } else { $env:TEMP }
        New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
        $diagnostics = Join-Path $env:RUNNER_TEMP 'weft-test-diagnostics'
        New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
        "WEFT_CANARY_TEST_TEMP=$testTemp" >> $env:GITHUB_ENV
        "WEFT_CANARY_DIAGNOSTICS=$diagnostics" >> $env:GITHUB_ENV
        "WEFT_CANARY_C_PROBE=$(Join-Path $env:TEMP 'weft-canary')" >> $env:GITHUB_ENV
        "WEFT_CANARY_D_PROBE=$(Join-Path $env:RUNNER_TEMP 'weft-canary')" >> $env:GITHUB_ENV
        "WEFT_CANARY_STOP=$(Join-Path $diagnostics 'canary.stop')" >> $env:GITHUB_ENV
        "test temp: $testTemp"
        "C probe: $(Join-Path $env:TEMP 'weft-canary')"
        "D probe: $(Join-Path $env:RUNNER_TEMP 'weft-canary')"

    - name: Start environment canary
      shell: pwsh
      run: |
        $arguments = @(
          'tests/windows_env_canary.py',
          '--output', (Join-Path $env:WEFT_CANARY_DIAGNOSTICS 'env-canary.jsonl'),
          '--stop-file', $env:WEFT_CANARY_STOP,
          '--probe-dir', "c=$env:WEFT_CANARY_C_PROBE",
          '--probe-dir', "d=$env:WEFT_CANARY_D_PROBE",
          '--interval', '1.0',
          '--spawn-interval', '2.0',
          '--max-seconds', '3300'
        )
        $canary = Start-Process -FilePath python -ArgumentList $arguments -PassThru -WindowStyle Hidden `
          -RedirectStandardError (Join-Path $env:WEFT_CANARY_DIAGNOSTICS 'env-canary.stderr.log') `
          -RedirectStandardOutput (Join-Path $env:WEFT_CANARY_DIAGNOSTICS 'env-canary.stdout.log')
        "WEFT_CANARY_PID=$($canary.Id)" >> $env:GITHUB_ENV
        Start-Sleep -Seconds 5
        if ($canary.HasExited) { throw "canary exited early with code $($canary.ExitCode)" }
        "canary pid $($canary.Id) running"

    - name: Run unchanged Windows CLI slice
      env:
        WEFT_TEST_PROGRESS_HEARTBEAT_SECONDS: '120'
        WEFT_TEST_DIAGNOSTICS_DIR: ${{ env.WEFT_CANARY_DIAGNOSTICS }}
        TEMP: ${{ env.WEFT_CANARY_TEST_TEMP }}
        TMP: ${{ env.WEFT_CANARY_TEST_TEMP }}
      run: |
        pytest -v --tb=short -m "not slow" tests/cli --override-ini="addopts=-ra -q --strict-markers -n logical --dist load" --durations=100 --durations-min=0.5 -o faulthandler_timeout=720 --timeout=900 --timeout-method=thread --full-trace

    - name: Stop environment canary
      if: always()
      shell: pwsh
      run: |
        $aliveAtStop = [bool](Get-Process -Id $env:WEFT_CANARY_PID -ErrorAction SilentlyContinue)
        @{ canary_pid = [int]$env:WEFT_CANARY_PID; alive_at_stop = $aliveAtStop; stop_requested_utc = [DateTime]::UtcNow.ToString('o') } |
          ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:WEFT_CANARY_DIAGNOSTICS 'canary-lifetime.json')
        if (-not $aliveAtStop) { Write-Warning "canary was not alive when the test step finished; its samples do not span the run" }
        New-Item -ItemType File -Force -Path $env:WEFT_CANARY_STOP | Out-Null
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Date) -lt $deadline -and (Get-Process -Id $env:WEFT_CANARY_PID -ErrorAction SilentlyContinue)) {
          Start-Sleep -Milliseconds 250
        }
        if (Get-Process -Id $env:WEFT_CANARY_PID -ErrorAction SilentlyContinue) {
          Stop-Process -Id $env:WEFT_CANARY_PID -Force
          "canary killed after stop-file timeout"
        } else {
          "canary exited on stop file"
        }
        Get-Content (Join-Path $env:WEFT_CANARY_DIAGNOSTICS 'env-canary.jsonl') | Measure-Object -Line

    - name: Retain canary samples and test diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: windows-env-canary-${{ matrix.python-version }}-temp-${{ matrix.temp_volume }}-r${{ matrix.repeat }}
        path: ${{ env.WEFT_CANARY_DIAGNOSTICS }}
        if-no-files-found: error
