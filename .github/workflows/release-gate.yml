name: Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    uses: ./.github/workflows/release.yml
    with:
      package_name: weft
      package_dir: .
      tag_name: ${{ github.ref_name }}
      release_ref: ${{ github.sha }}
      expected_tag_commit: ${{ github.sha }}
      create_github_release: true
    permissions:
      actions: read
      contents: write
      id-token: write
